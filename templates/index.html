<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir archivo — Sales Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="sa-nav">
        <div class="container d-flex align-items-center justify-content-between">
            <a class="sa-nav__brand" href="/">
                <svg class="sa-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/>
                </svg>
                Sales Analyzer
            </a>
        </div>
    </nav>

    <div class="page-wrap">

        <!-- Step Indicator -->
        <nav aria-label="Progreso" class="steps-indicator">
            <div class="step step--active">
                <div class="step__circle">1</div>
                <span class="step__label">Subir archivo</span>
            </div>
            <div class="step-connector" role="presentation"></div>
            <div class="step step--pending">
                <div class="step__circle">2</div>
                <span class="step__label">Columnas</span>
            </div>
            <div class="step-connector" role="presentation"></div>
            <div class="step step--pending">
                <div class="step__circle">3</div>
                <span class="step__label">Informe</span>
            </div>
        </nav>

        <!-- Page Header -->
        <div class="page-header">
            <h1>Sube tu archivo</h1>
            <p>Excel o CSV con tus datos de ventas</p>
        </div>

        <!-- Upload Card -->
        <div class="sa-card">

            {% if error %}
            <div class="sa-alert sa-alert--danger" role="alert">
                <svg class="sa-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true" style="margin-top:1px;flex-shrink:0;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/upload" method="POST" enctype="multipart/form-data" id="upload-form">
                <div class="sa-field">
                    <label for="archivo" class="sa-label">
                        Selecciona tu archivo <span class="required-mark" aria-label="obligatorio">*</span>
                    </label>
                    <div class="file-zone" onclick="document.getElementById('archivo').click()" style="cursor:pointer">
                        <svg class="sa-icon mb-3" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.25" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--color-primary);opacity:.7;">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z"/>
                        </svg>
                        <p class="mb-1" style="font-size:.9375rem;color:var(--color-text);">Haz clic para seleccionar</p>
                        <p class="mb-3" style="font-size:.8125rem;color:var(--color-text-muted);">Formatos soportados: .xlsx, .xls, .csv</p>
                        <p id="file-name" style="font-size:.875rem;color:var(--color-primary);font-weight:600;"></p>
                        <input type="file" id="archivo" name="archivo" accept=".xlsx,.xls,.csv" required
                            style="display:none" aria-describedby="archivo-hint">
                    </div>
                    <p id="archivo-hint" class="sa-helper">El archivo no debe superar los 10 MB</p>
                </div>

                <button type="submit" class="btn-sa btn-sa--primary mt-1" id="submit-btn">
                    Continuar
                    <svg class="sa-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
                    </svg>
                </button>
            </form>
        </div>

    </div>

    <script>
        document.getElementById('upload-form').addEventListener('submit', function () {
            var btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Subiendo...';
        });

        document.getElementById('archivo').addEventListener('change', function() {
        var nombre = this.files[0] ? this.files[0].name : '';
        document.getElementById('file-name').textContent = nombre;
        });
    </script>
</body>
</html>
